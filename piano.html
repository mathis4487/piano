<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F5BD5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<style>:root{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}html{-webkit-text-size-adjust:100%}</style>
<title>Piano ludique</title>
<style>
/* Mise en page : une colonne, pensée pour le téléphone tenu en vertical. Les notes tombent dans l'axe des touches du vrai piano. */
:root{
  --bg:#EDEFF3;--surface:#FFFFFF;--ink:#14161C;--muted:#5B6270;--line:#D5D9E1;
  --accent:#4F5BD5;--accent-ink:#FFFFFF;--accent-soft:#E3E6FB;
  --good:#1B8F62;--bad:#CF3D57;--lane:#E4E7EE;--field:#F6F7FA;
  --wkey:#FBFBFD;--wkey-edge:#B9BFCC;--bkey:#1B1E27;--dock:#DDE0E8;
  --f-display:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1117;--surface:#181B24;--ink:#ECEEF4;--muted:#9AA1B1;--line:#2A2F3C;
  --accent:#8E99FF;--accent-ink:#0F1117;--accent-soft:#252A4A;
  --good:#3DD598;--bad:#FF6B84;--lane:#1B1F2A;--field:#12151C;
  --wkey:#E9EBF1;--wkey-edge:#7D8394;--bkey:#07080C;--dock:#12141B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1117;--surface:#181B24;--ink:#ECEEF4;--muted:#9AA1B1;--line:#2A2F3C;
  --accent:#8E99FF;--accent-ink:#0F1117;--accent-soft:#252A4A;
  --good:#3DD598;--bad:#FF6B84;--lane:#1B1F2A;--field:#12151C;
  --wkey:#E9EBF1;--wkey-edge:#7D8394;--bkey:#07080C;--dock:#12141B;color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.btn,summary,label,[data-a],[data-open],[data-cat],[data-lvl],[data-hand],[data-mx]{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .bk{font-weight:700;min-height:40px}
.top h1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:-.01em;margin-right:auto}

.stage{flex:1;min-height:0;overflow-y:auto;padding:16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.view{display:flex;flex-direction:column;gap:16px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:800;font-size:1.1rem;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stars{color:var(--accent);letter-spacing:.12em;font-size:.95rem;white-space:nowrap}
.stars.big{font-size:2rem}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere}
.stat span{font-size:.72rem;color:var(--muted)}

.plan{display:flex;flex-direction:column;gap:8px}
.pi{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field);text-align:left;width:100%}
.pi .t{flex:1;min-width:0}
.pi .t b{display:block}
.pi .t span{font-size:.82rem;color:var(--muted)}
.pi .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.pi.done .ck{background:var(--good);border-color:var(--good);color:#fff}

.list{display:flex;flex-direction:column;gap:6px}
.pr{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);text-align:left;width:100%}
.pr .n{font-family:var(--f-display);font-weight:800;width:1.6rem;flex:none;color:var(--muted)}
.pr .t{flex:1;min-width:0}
.pr .t b{display:block}
.pr .t span{font-size:.8rem;color:var(--muted)}
.pr.rec{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prw{display:flex;gap:6px;align-items:stretch}
.prw .pr{flex:1;min-width:0;width:auto}
.fav{flex:none;width:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:1.35rem;line-height:1;color:var(--muted);padding:0}
.uni{display:flex;align-items:center;gap:8px;flex:1;font-weight:600}
.uni select{flex:1;min-width:0}
.fav[aria-pressed="true"],.favb[aria-pressed="true"]{color:#D6336C;border-color:#D6336C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fav[aria-pressed="true"],:root:not([data-theme="light"]) .favb[aria-pressed="true"]{color:#FF7AA8;border-color:#FF7AA8}}
:root[data-theme="dark"] .fav[aria-pressed="true"],:root[data-theme="dark"] .favb[aria-pressed="true"]{color:#FF7AA8;border-color:#FF7AA8}
.tag{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 6px;font-weight:600;margin-left:6px;font-style:normal}

.fld{display:flex;flex-direction:column;gap:6px}
.fld label.l,.fld span.l{font-weight:600;font-size:.88rem}
.fld input[type=text],.fld input[type=number],.fld textarea,select{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
.fld textarea{min-height:120px;font-family:var(--f-mono);font-size:.82rem;resize:vertical}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--field)}
.opt input{margin-top:4px}
.opt span{display:block}
.opt small{color:var(--muted);display:block}
.range{width:100%;accent-color:var(--accent)}
.spdGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.spdChip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;line-height:1.15;white-space:normal;text-align:center}
.spdChip small{opacity:.8;font-weight:600}
.spdRow{align-items:center;justify-content:space-between;flex-wrap:nowrap}
.spdRow .count{font-size:.95rem;text-align:center}

.hud{display:flex;flex-direction:column;gap:10px}
.hud .top2{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.pmsg{min-height:1.5em;font-weight:600}
.pmsg.good{color:var(--good)}.pmsg.bad{color:var(--bad)}
.count{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.hm{aspect-ratio:1/1;border-radius:5px;background:var(--field);border:1px solid var(--line)}
.hm.on{background:color-mix(in srgb,var(--accent) calc(var(--o)*100%),var(--field));border-color:transparent}
.hm.fut{opacity:.35}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal7 small{text-align:center;font-size:.68rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.ms{display:flex;gap:8px;align-items:center}
.ms i{font-style:normal;width:1.2rem;text-align:center;color:var(--muted)}
.ms.ok i{color:var(--good);font-weight:700}
.vel i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.vel{position:relative;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.vel>span{display:block;height:100%;width:0;background:var(--accent);transition:width .08s}
.pinfo{min-height:1.4em;font-size:.88rem;color:var(--muted)}

.dock{background:var(--dock);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
#cv{display:block;width:100%;height:clamp(150px,34vh,300px);background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tg{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600}
.tg .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.tg[aria-pressed="true"]{border-color:var(--good)}
.tg[aria-pressed="true"] .dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.mm{display:grid;grid-template-columns:3.4rem 1fr;gap:4px 8px;align-items:center;font-size:.72rem;color:var(--muted)}
.big{padding:14px 18px;font-size:1rem;border-radius:12px}
details.dd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
details.dd>summary{cursor:pointer;font-weight:600}
details.dd[open]>summary{margin-bottom:12px}
.ddin{display:flex;flex-direction:column;gap:12px}
ol.steps{margin:0;padding-left:1.2rem;color:var(--muted)}
ol.steps li{margin:3px 0}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sheet{display:flex;flex-wrap:wrap;gap:10px 12px}
.mes{display:inline-flex;gap:3px;padding-left:6px;border-left:3px solid var(--line);align-items:flex-end}
.nc{display:flex;flex-direction:column;align-items:stretch;gap:1px;text-align:center}
.ch{display:flex;flex-direction:row;align-items:center;gap:2px}
.lns{display:flex;flex-direction:column;gap:2px}
.ln{display:flex;align-items:center;justify-content:center;gap:2px;border-radius:.5em;padding:2px 3px}
.ln.r{background:color-mix(in srgb,#2f6df6 18%,var(--surface))}
.ln.l{background:color-mix(in srgb,#f08a1c 24%,var(--surface))}
.ln.e{opacity:.6}
.hd{font-size:.7em;font-weight:800;color:var(--ink);margin-right:1px}
.rs{color:var(--muted);font-weight:700;padding:0 .4em}
.pl{font-style:normal;font-weight:800;color:var(--ink);font-size:.85em}
.sheet.one .hd{display:none}
.nn{display:block;color:#fff;font-weight:700;font-size:.8rem;line-height:1.15;padding:3px 6px;border-radius:6px;min-width:34px}
.nn sub{font-size:.58rem;font-weight:500;opacity:.9}
.nc small{display:flex;align-items:flex-end;justify-content:center;gap:.2em;font-size:.7rem;color:var(--muted);line-height:1;margin-top:2px}
.ds{height:1.7em;width:auto;flex:none}
.dt{font-style:normal}
.sov-s.dense .dt,.sov-s.dense .ix,.sov-s.dense .hd{display:none}
.sov-s.dense .ln.e{display:none}
.sov-s.dense .nc{flex-direction:row;align-items:center;gap:.2em;background:var(--field);border-radius:.55em;padding:.08em .15em}
.sov-s.dense .nc.rest{background:none}
.sov-s.dense .ln{padding:.05em .15em;gap:.1em;border-radius:.4em}
.sov-s.dense .ch{gap:.08em}
.sov-s.dense .lns{gap:.1em}
.sov-s.dense .nc small{margin-top:0}
.sov-s.dense .ds{height:1.5em}
.sov-s.dense .mes{align-items:center;border-left-width:.18em;padding-left:.3em;gap:.3em .35em}
.sov-s.dense .nn{padding:.12em .2em;min-width:0}
.sov-s.dense .sheet{gap:.4em .5em}
.ix{display:block;align-self:flex-start;min-width:1.5em;height:1.5em;line-height:1.5em;font-size:.62em;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;text-align:center;padding:0 .3em;margin-bottom:2px}
.mes::before{content:attr(data-n);align-self:flex-start;font-size:.62em;font-weight:800;color:var(--muted);margin-right:.2em}
.hk{display:flex;flex-wrap:wrap;gap:4px 5px;font-size:.7rem;line-height:1.2;color:var(--muted)}
.kc{display:inline-flex;align-items:center;gap:.3em;padding:2px 7px;border-radius:999px;background:var(--field);border:1px solid var(--line)}
.kc b{color:var(--ink)}
.kc em{font-style:normal;opacity:.75}
.kh{display:inline-block;min-width:1.5em;text-align:center;padding:0 .3em;border-radius:999px;color:var(--ink);font-weight:800}
.kh.r{background:color-mix(in srgb,#2f6df6 30%,var(--surface))}
.kh.l{background:color-mix(in srgb,#f08a1c 38%,var(--surface))}
.nc.rest .nn{background:var(--line);color:var(--muted)}
/* Vue « une page » : tout le morceau tient sur l'écran, sans défilement ni zoom ; la taille des cases s'ajuste toute seule */
.sov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.sov-h{display:flex;align-items:center;gap:8px}
.sov-h h2{font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sov-s{flex:1;min-height:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.sov-s .sheet{gap:.8em .9em;align-content:flex-start;line-height:1}
.sov-s .mes{gap:.5em .25em;padding-left:.45em;border-left-width:.22em;flex-wrap:wrap;max-width:100%}
.sov-s .nn{font-size:1em;line-height:1.15;padding:.25em .4em;min-width:2.6em;border-radius:.45em}
.sov-s .nn sub{font-size:.62em}
.sov-s .nc small{font-size:.72em;margin-top:.25em}
.sov-s .ds{height:1.9em}
.sov-s.big{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sov-s.big .sheet{align-content:flex-start}
.sov-r{height:48px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow:hidden}
.sov-r svg{display:block;width:100%;height:100%}
.sov-f{display:flex;gap:8px}
.sov-f .btn{flex:1}
label.btn{position:relative;display:inline-block;text-align:center}
.vh{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-width:520px){
  .top{padding:8px 12px;gap:6px}
  .top h1{font-size:1.1rem}
  .stage{padding:12px}
  .col,.view{gap:12px}
  .card{padding:14px;border-radius:12px}
  h2{font-size:1.35rem}
  .dock{padding-left:12px;padding-right:12px}
  .tbl{font-size:.8rem}
  .micrew .btn{flex:1 1 100%}
}
@media (orientation:portrait){#cv{height:clamp(260px,50vh,560px)}}
@media (pointer:coarse){.btn{min-height:44px}.tg{min-height:38px}.opt{padding:11px 12px}.pr,.pi{min-height:48px}}
@media (prefers-reduced-motion:reduce){.bar>span,.vel>span{transition:none}}

.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));gap:2px}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;font-weight:700;color:var(--muted);min-height:54px}
.tabs button i{font-style:normal;font-size:1.4rem;line-height:1.1}
.tabs button[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.card.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#9B5CF6));color:var(--accent-ink);border:0;gap:14px}
.hero .eyebrow{color:inherit;opacity:.85}
.hero h2{font-size:1.7rem}
.hchips{display:flex;gap:8px;flex-wrap:wrap}
.hchips span{background:color-mix(in srgb,var(--accent-ink) 16%,transparent);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.85rem}
.hero .bar{background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.hero .bar>span{background:var(--accent-ink)}
.btn.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.2rem;padding:17px 18px;border-radius:16px;width:100%;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.hero .btn.play{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent-ink) 55%,transparent)}
.btn.play:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.btn.play.pulse{animation:pulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.btn.play.pulse{animation:none}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chips .btn{flex:none;white-space:nowrap}
.srch{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem}
details.dd2{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--field)}
details.dd2>summary{cursor:pointer;font-weight:600}
details.dd2[open]>summary{margin-bottom:10px}
.one{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-weight:600;color:var(--muted)}
.btn.big.play{font-size:1.25rem}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.stars.big{display:inline-block;animation:pop .6s ease-out}
@media (prefers-reduced-motion:reduce){.stars.big{animation:none}}
#toast{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.3)}
</style>

<header class="top">
  <button class="tg bk" id="tgBack" data-a="back" aria-label="Revenir à l'écran précédent" hidden>← Retour</button>
  <h1>Piano ludique</h1>
  <button class="tg" id="tgMic" aria-pressed="false" aria-label="Activer ou couper le micro"><i class="dot"></i><span id="tgMicT">Micro coupé</span></button>
</header>

<main class="stage" id="stage">
  <div class="col">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-profile" hidden></section>
    <section class="view" id="v-setup" hidden></section>
    <section class="view" id="v-play" hidden></section>
    <section class="view" id="v-result" hidden></section>
    <section class="view" id="v-create" hidden></section>
    <section class="view" id="v-progress" hidden></section>
  </div>
</main>

<nav class="tabs" id="tabs" aria-label="Navigation principale" hidden>
  <button data-tab="accueil" aria-current="page"><i>🏠</i>Accueil</button>
  <button data-tab="morceaux"><i>🎵</i>Morceaux</button>
  <button data-tab="progress"><i>📈</i>Évolution</button>
  <button data-tab="plus"><i>⚙️</i>Plus</button>
</nav>

<footer class="dock" id="dock" hidden><canvas id="cv"></canvas></footer>

<div class="sov" id="sov" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const FR=['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];

const LOW_ABS=21,HIGH_ABS=108;
/* Détection de hauteur (méthode NSDF, une note à la fois) */
function detectPitch(buf,sr){
  const N=buf.length,maxLag=Math.min(1100,(N>>1)-1),minLag=Math.max(2,Math.floor(sr/2200));
  const ns=new Float32Array(maxLag+1);
  for(let t=0;t<=maxLag;t++){
    let a=0,m=0;
    for(let i=0;i<N-t;i++){const x=buf[i],y=buf[i+t];a+=x*y;m+=x*x+y*y;}
    ns[t]=m>0?2*a/m:0;
  }
  let t=1;while(t<maxLag&&ns[t]>0)t++;
  const peaks=[];let best=0;
  while(t<maxLag){
    while(t<maxLag&&ns[t]<=0)t++;
    let pk=-1,pv=0;
    while(t<maxLag&&ns[t]>0){if(ns[t]>pv){pv=ns[t];pk=t;}t++;}
    if(pk>=minLag){peaks.push([pk,pv]);if(pv>best)best=pv;}
  }
  if(!peaks.length||best<0.6)return null;
  const sel=peaks.find(p=>p[1]>=0.9*best),lag=sel[0],val=sel[1];
  let delta=0;
  if(lag>1&&lag<maxLag){const a=ns[lag-1],b=ns[lag],c=ns[lag+1],den=a-2*b+c;if(den!==0)delta=0.5*(a-c)/den;}
  return {f:sr/(lag+delta),clarity:val};
}
const med=a=>{const s=a.slice().sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};
const PCS={do:0,re:2,'ré':2,mi:4,fa:5,sol:7,la:9,si:11,c:0,d:2,e:4,f:5,g:7,a:9,b:11};
function parseNote(s){
  const mm=/^(sol|do|re|ré|mi|fa|la|si|[a-g])([#♯b♭]?)(\d?)$/i.exec(s);if(!mm)return null;
  let pc=PCS[mm[1].toLowerCase()];const a=mm[2];
  if(a==='#'||a==='♯')pc+=1;else if(a)pc-=1;
  return ((mm[3]===''?4:+mm[3])+1)*12+pc;
}
function parse(dsl){
  const out=[];let b=0;
  for(const tk0 of dsl.trim().split(/\s+/).filter(x=>x&&x!=='|')){
    let tk=tk0,nu=null;
    const mn=/@(pp|p|mp|mf|f|ff)$/.exec(tk);
    if(mn){nu=mn[1];tk=tk.slice(0,mn.index);}
    const parts=tk.split(':'),nn=parts[0],d=parts[1]===undefined?1:parseFloat(parts[1]);
    if(!(d>0))return {err:'Durée invalide : '+tk0};
    if(nn.toLowerCase()==='r'||nn==='-'){b+=d;continue;}
    const ns=[];
    for(const part of nn.split('+')){
      const m=parseNote(part);
      if(m===null)return {err:'Note inconnue : '+part};
      if(m<LOW_ABS||m>HIGH_ABS)return {err:'Note hors du clavier (La0 à Do8) : '+part};
      ns.push(m);
    }
    out.push({b,d,n:ns,nu});b+=d;
  }
  if(!out.length)return {err:'Aucune note trouvée.'};
  return {events:out,total:b};
}

  if(b<3.5)return 'blanche pointée (3 temps)';
  return 'ronde (4 temps)';
}
/* Répartition des notes entre les deux mains (par registre) : retourne {mode:'R'|'L'|'RL', ev:[{R:[notes graves→aiguës],L:[…]}]} */
function splitHands(p,evs){
  const all=[];evs.forEach(e=>e.n.forEach(m=>all.push(m)));all.sort((x,y)=>x-y);
  const med=all[all.length>>1],decl=p&&p.h;
  const cut=s=>{
    const n=s.length;if(n<2||s[n-1]-s[0]<=12)return -1;
    let bi=-1,bs=-1;
    for(let i=0;i<n-1;i++){
      const ok=(s[i]-s[0]<=12&&s[n-1]-s[i+1]<=12)?1000:0,sc=ok+(s[i+1]-s[i]);
      if(sc>bs){bs=sc;bi=i;}
    }
    return (bs>=1000||bs>=5)?bi:-1;
  };
  const asc=e=>e.n.slice().sort((x,y)=>x-y);
  const two=decl===2?true:decl===1?false:evs.some(e=>cut(asc(e))>=0);
  if(!two){
    const h=med<58?'L':'R';
    return {mode:h,ev:evs.map(e=>h==='R'?{R:asc(e),L:[]}:{R:[],L:asc(e)})};
  }
  let lastR=67,lastL=48;
  const ev=evs.map(e=>{
    const s=asc(e),k=cut(s);
    if(k>=0){const L=s.slice(0,k+1),R=s.slice(k+1);lastL=L[L.length-1];lastR=R[0];return {L,R};}
    const n=s.length,c=(s[0]+s[n-1])/2;
    let h;
    if(n===2&&s[0]<=55&&s[1]>=59&&s[1]-s[0]<=12)return (lastL=s[0],lastR=s[1],{L:[s[0]],R:[s[1]]});
    if(c>=63)h='R';else if(c<=55)h='L';else h=Math.abs(c-lastR)<=Math.abs(c-lastL)?'R':'L';
    if(h==='R'){lastR=s[0];return {R:s,L:[]};}
    lastL=s[n-1];return {R:[],L:s};
  });
  const usesL=ev.some(x=>x.L.length),usesR=ev.some(x=>x.R.length);
  return {mode:usesL&&usesR?'RL':usesL?'L':'R',ev};
}
/* Niveau d'un enregistrement : saturation, faiblesse du signal, bruit de fond (utile pour tester un câble branché au piano) */
function levelCheck(x,sr){
  let pk=0,clip=0;
  for(let i=0;i<x.length;i++){const a=Math.abs(x[i]);if(a>pk)pk=a;if(a>=0.985)clip++;}
  const W=Math.max(64,Math.round(sr*0.023)),r=[];
  for(let i=0;i+W<=x.length;i+=W){let s=0;for(let k=i;k<i+W;k++)s+=x[k]*x[k];r.push(Math.sqrt(s/W));}
  r.sort((a,b)=>a-b);
  const floor=r.length?r[Math.floor(r.length*0.04)]:0,sig=r.length?r[Math.min(r.length-1,Math.floor(r.length*0.95))]:0;
  const snr=sig>0?20*Math.log10(sig/Math.max(floor,1e-6)):0;
  return {peak:pk,clipFrac:x.length?clip/x.length:0,snr,floor,sig,
    status:pk>=0.99&&clip/Math.max(1,x.length)>0.001?'sature':pk<0.04?'faible':'bon'};
}

let LOW=48,HIGH=72,whites=[],geo={};const showNames=true;
const fold=m=>{while(m<LOW)m+=12;while(m>HIGH)m-=12;return m;};
function setRange(lo,hi){
  if(lo===LOW&&hi===HIGH&&whites.length)return;
  LOW=lo;HIGH=hi;whites=[];geo={};
  for(let m=lo;m<=hi;m++)if(!isBlack(m))whites.push(m);
  const W=100/whites.length;
  whites.forEach((m,i)=>{geo[m]=[i*W,W];});
  for(let m=lo;m<=hi;m++)if(isBlack(m)){const i=whites.indexOf(m-1);geo[m]=[(i+1)*W-W*0.3,W*0.6];}
}

let ctx=null;
function ensureAudio(){
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ctx=new AC();}
  if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
  return ctx;
}
let master=null;
/* Petit piano synthétique, utilisé uniquement pour la démonstration */
let voices=0;
function synth(m,when,dur,vel){
  const c=ensureAudio();if(!c)return;
  if(!master){master=c.createGain();master.gain.value=0.8;const comp=c.createDynamicsCompressor();master.connect(comp);comp.connect(c.destination);}
  const f=440*Math.pow(2,(m-69)/12),g=c.createGain();
  g.gain.setValueAtTime(0.0001,when);g.gain.linearRampToValueAtTime(0.38*vel,when+0.008);g.gain.setTargetAtTime(0.07*vel,when+0.01,0.7);
  g.gain.setTargetAtTime(0.0001,when+dur,0.09);g.connect(master);
  const parts=voices>14?[['triangle',1,1]]:voices>7?[['triangle',1,1],['sine',2,0.3]]:[['triangle',1,1],['sine',2,0.3],['sine',3,0.12]];
  parts.forEach(q=>{const o=c.createOscillator(),pg=c.createGain();o.type=q[0];o.frequency.value=f*q[1];pg.gain.value=q[2];o.connect(pg);pg.connect(g);voices++;o.onended=()=>{voices=Math.max(0,voices-1);try{o.disconnect();pg.disconnect();}catch(x){}};o.start(when);o.stop(when+dur+0.5);});
}

function challenge(){
  const pool=allPieces().filter(x=>!x.custom&&x.lvl>=3);if(!pool.length)return null;
  const d=today();let h=0;for(let i=0;i<d.length;i++)h=(h*31+d.charCodeAt(i))>>>0;

}
function plan(){
  const done=(days[today()]||{}).done||[],items=[],rec=recommended();
  if(PIECES.indexOf(rec)>PIECES.findIndex(x=>x.id==='cinq'))items.push({id:'cinq',label:'Échauffement',sub:'Cinq notes pour réveiller les doigts'});
  items.push({id:rec.id,label:rec.title,sub:'À travailler aujourd\'hui'});
  const rev=PIECES.filter(p=>p.id!==rec.id&&p.id!=='cinq'&&(prog[p.id]||{}).stars>0).sort((a,b)=>prog[a.id].acc-prog[b.id].acc)[0];
  if(rev)items.push({id:rev.id,label:rev.title,sub:'À réviser ('+Math.round(prog[rev.id].acc*100)+' % de réussite)'});
  if(profile&&profile.goal==='create')items.push({id:'__create',label:'Composer',sub:'Écris ou joue une courte mélodie à toi'});
  const pu=profile&&profile.univ&&profile.univ!=='all'?UNIV.find(p=>p.univ===profile.univ&&((prog[p.id]||{}).stars||0)<3):null;
  if(pu)items.push({id:pu.id,label:pu.title,sub:'Pour le plaisir : '+pu.tag});
  const ch=challenge();if(ch&&!items.some(i=>i.id===ch.id))items.push({id:ch.id,label:'Défi du jour : '+ch.title,sub:'Niveau '+ch.lvl+' sur 5, pour te dépasser'});

}

  if(stem)q+='<line x1="6.9" y1="10.2" x2="6.9" y2="1.2" stroke="currentColor" stroke-width="1.1"/>';
  for(let i=0;i<fl;i++)q+='<path d="M6.9 '+(1.2+i*2.6)+' Q10.6 '+(3.4+i*2.6)+' 9.6 '+(7+i*2.6)+'" fill="none" stroke="currentColor" stroke-width="1.2"/>';

function noteSheet(p,E){

  const chip=m=>'<span class="nn" style="background:'+pcCol(m)+'">'+pcn(m)+'<sub>'+(Math.floor(m/12)-1)+'</sub></span>';

    $('v-play').innerHTML='<div class="hud"><div class="top2"><div><div class="eyebrow">Démonstration</div><h3>'+esc(P.piece.title)+'</h3></div><div class="row"><button class="btn sm" data-a="pause" id="bPause">Pause</button><button class="btn sm" data-a="quit">Arrêter</button></div></div><div class="row spdRow"><button class="btn sm" data-a="spdm">➖ Plus lent</button><span class="count" id="pspd">'+spdLabel(P.tempo)+'</span><button class="btn sm" data-a="spdp">Plus vite ➕</button></div><div class="bar"><span id="pbar"></span></div><p class="muted">Regarde les notes tomber et écoute : chaque note se joue quand elle touche la ligne.</p><div class="pmsg" id="pmsg"></div></div>';
    updateHud();return;
  }
  $('v-play').innerHTML='<div class="hud"><div class="top2"><div><div class="eyebrow">'+(P.mode==='wait'?'Mode j\'attends mes notes':'Mode en rythme')+'</div><h3>'+esc(P.piece.title)+'</h3></div><div class="row"><button class="btn sm" data-a="pause" id="bPause">Pause</button><button class="btn sm" data-a="quit">Quitter</button></div></div>'+
    '<div class="row spdRow"><button class="btn sm" data-a="spdm">➖ Plus lent</button><span class="count" id="pspd">'+spdLabel(P.tempo)+'</span><button class="btn sm" data-a="spdp">Plus vite ➕</button></div><div class="row"><button class="btn sm" data-a="skipch" id="bSkip" hidden>Passer cet accord</button></div><div class="bar"><span id="pbar"></span></div><div class="row" style="justify-content:space-between"><span class="count" id="pscore"></span><span class="count" id="pcombo"></span></div>'+
    '<div class="mm"><span>Force</span><div class="vel" aria-hidden="true"><span id="pvel"></span></div>'+(nMidi()?'<span>Piano relié (MIDI)</span>':'<span>Micro</span><div class="vel" aria-hidden="true"><span class="mLvl"></span><i class="mThr"></i></div>')+'</div><div class="pinfo" id="pinfo" aria-live="polite"></div><div class="pmsg" id="pmsg" role="status" aria-live="polite"></div></div>';
  updateHud();
}
function updateHud(){
  if(!P)return;const n=P.events.length,doneN=P.events.filter(e=>e.state).length;
  const b=$('pbar'),s=$('pscore'),c=$('pcombo'),m=$('pmsg'),i=$('pinfo'),v=$('pvel');
  if(b)b.style.width=Math.round(doneN/n*100)+'%';
  if(s)s.textContent=P.mode==='time'?P.score+' points':P.hits+' / '+n+' notes';
  if(c)c.textContent=P.combo>1?'Série de '+P.combo:'';
  if(m){m.textContent=P.msg;m.className='pmsg '+P.cls;}
  if(i)i.textContent=P.info;
  if(v)v.style.width=Math.round(P.lastVel/127*100)+'%';
  const sk=$('bSkip');if(sk){sk.hidden=!(P.stuck&&!P.stuck.state&&P.stuck.tries>=2);sk.textContent=P.stuck&&P.stuck.n.length===1?'Passer cette note':'Passer cet accord';}
}
const say=(t,c)=>{P.msg=t;P.cls=c||'';updateHud();};
const nextEv=()=>{while(P.ptr<P.events.length&&P.events[P.ptr].state)P.ptr++;return P.events[P.ptr];};
/* Position dans le morceau (en temps) à l'instant exact d'une touche */
const tAt=at=>(!P||P.mode!=='time'||P.paused)?(P?P.t:0):P.t+(at-P.tickAt)/1000*P.bps;

function tick(ts){
  if(!P||!P.running)return;
  const dt=Math.min(0.1,(ts-P.last)/1000);P.last=ts;
  const bps=P.piece.bpm*P.tempo/100/60;P.bps=bps;P.tickAt=ts;
  if(!P.paused){
    P.sec+=dt;
    let nt=P.t+dt*bps;
    const e0=nextEv();
    if(P.mode==='wait'&&e0&&nt>e0.b)nt=Math.max(P.t,e0.b);
    P.t=nt;
    if(P.mode==='demo'){
      for(const e of P.events){
        if(!e.state&&P.t>=e.b){
          e.state='hit';e.rt=performance.now();
          const c=ensureAudio();
          e.n.forEach(m=>{if(c)synth(m,c.currentTime,Math.max(0.2,e.d/bps*0.95),0.8);flash(m,'good');paint(m,true);setTimeout(()=>paint(m,false),220);});
        }
      }
      if(P.t>P.total+0.2){endDemo();return;}
    }
    if(P.mode==='time'){
      let changed=false;
      for(const e of P.events){if(!e.state&&P.t-e.b>0.4&&!(P.chordWait&&P.chordWait.e===e)){e.state='miss';e.rt=performance.now();P.miss++;P.combo=0;e.n.forEach(m=>{P.missBy[m]=(P.missBy[m]||0)+1;});changed=true;}}
      if(changed){say('Raté, continue.','bad');}
    }
    if(!nextEv()&&P.t>P.total+0.3&&(Object.keys(P.act).length===0||P.t>P.total+2)){endPlay();return;}
  }
  if(++P.frame%60===1)readCols();
  draw();
  P.raf=requestAnimationFrame(tick);
}

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.quadraticCurveTo(x+w,y,x+w,y+r);
  cx.lineTo(x+w,y+h-r);cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);cx.lineTo(x+r,y+h);cx.quadraticCurveTo(x,y+h,x,y+h-r);
  cx.lineTo(x,y+r);cx.quadraticCurveTo(x,y,x+r,y);cx.closePath();
}
function draw(){
  const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h||!col)return;
  cx.clearRect(0,0,w,h);
  cx.strokeStyle=col.lane;cx.lineWidth=1;
  whites.forEach(m=>{const x=Math.round(geo[m][0]/100*w)+0.5;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,h);cx.stroke();});
  const FOOT=24,hitY=h-FOOT-6,pxb=Math.max(38,Math.min(72,(h-FOOT)/4.6)),now=performance.now();
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i],age=now-f.t;if(age>380){fx.splice(i,1);continue;}
    const g=geo[f.m];if(!g)continue;
    cx.globalAlpha=0.35*(1-age/380);cx.fillStyle=f.cls==='bad'?col.bad:col.good;cx.fillRect(g[0]/100*w,0,g[1]/100*w,h-FOOT);cx.globalAlpha=1;
  }
  cx.strokeStyle=col.accent;cx.lineWidth=2;cx.beginPath();cx.moveTo(0,hitY);cx.lineTo(w,hitY);cx.stroke();
  const wait=P.mode==='wait',head=wait?nextEv():null;
  for(const e of P.events){
    const bottom=hitY-(e.b-P.t)*pxb,top=bottom-e.d*pxb;
    if(bottom<-4||top>h)continue;
    let alpha=1,c=col.accent;
    if(e.state==='hit'){alpha=Math.max(0,1-(now-e.rt)/280);c=col.good;}
    else if(e.state==='miss'){alpha=0.45;c=col.bad;}
    if(alpha<=0)continue;
    e.n.forEach(m=>{
      const g=geo[m];if(!g)return;
      const x=g[0]/100*w,bw=g[1]/100*w,bh=Math.max(14,bottom-top)-3;
      cx.globalAlpha=alpha;cx.fillStyle=(e.state==='hit'||e.state==='miss')?c:pcCol(m);
      rr(x+2,bottom-bh-2,bw-4,bh,6);cx.fill();
      if(head===e&&e.b-P.t<0.01){cx.strokeStyle=col.ink;cx.lineWidth=2;cx.strokeRect(x+2,bottom-bh-2,bw-4,bh);}
      if(showNames&&bh>20&&bw>18){cx.fillStyle='#fff';cx.font='600 '+(bw<28?10:11)+'px '+col.font;cx.textAlign='center';cx.fillText(pcn(m)+(e.nu&&bw>=34?' '+e.nu:''),x+bw/2,bottom-bh+14);}
      cx.globalAlpha=1;
    });
  }
  cx.fillStyle=col.lane;cx.fillRect(0,h-FOOT,w,FOOT);
  cx.font='600 10px '+col.font;cx.textAlign='center';
  whites.forEach(m=>{const g=geo[m],x=g[0]/100*w,bw=g[1]/100*w;
    if(downSet.has(m)){cx.fillStyle=col.accent;cx.fillRect(x+1,h-FOOT,bw-2,FOOT);}
    cx.fillStyle=downSet.has(m)?col.acci:col.muted;cx.fillText(m%12===0?nm(m):pcn(m),x+bw/2,h-6);});
  Object.keys(geo).forEach(k=>{const m=+k;if(!isBlack(m))return;const g=geo[m],x=g[0]/100*w,bw=g[1]/100*w;
    cx.fillStyle=downSet.has(m)?col.accent:col.ink;cx.fillRect(x,h-FOOT,bw,10);});
  if(P.t<0){cx.fillStyle=col.ink;cx.font='800 28px sans-serif';cx.textAlign='center';cx.fillText(String(Math.ceil(-P.t)),w/2,h/2);}
}

const matches=(note,tgt)=>note%12===tgt%12;
function resolve(e,tt){
  const wait=P.mode==='wait',d=Math.abs(tt-e.b);let pts,msg='',cls='good';
  if(wait){pts=50;}
  else if(d<=0.12){pts=100;P.perfect++;msg='Parfait';}
  else{pts=60;msg=tt<e.b?'Un peu tôt':'Un peu tard';}
  if(e.vels.length){
    const av=e.vels.reduce((a,b)=>a+b,0)/e.vels.length,x=lvl(av),nn=nuName(x);
    P.velSum+=av;P.velN++;P.velAll.push(av);
    e.info=e.n.map(pcn).join(' + ')+' · force '+nn+' ('+Math.round(av)+')';
    P.info=e.info;
    if(e.nu){
      const bd=NU[e.nu];P.nuN++;
      if(x<bd[0]){msg=(msg?msg+' · ':'')+'Plus fort ('+e.nu+')';cls='';}
      else if(x>bd[1]){msg=(msg?msg+' · ':'')+'Plus doux ('+e.nu+')';cls='';}
      else P.nuOk++;
    }
  }
  if(P.stuck===e)P.stuck=null;
  e.state='hit';e.rt=performance.now();P.hits++;P.combo++;if(P.combo>P.best)P.best=P.combo;
  P.score+=pts*(1+Math.min(3,Math.floor(P.combo/8)));
  e.n.forEach(m=>flash(m,'good'));say(msg,cls);
}
function evalDur(e){
  const avg=e.durs.reduce((a,b)=>a+b,0)/e.durs.length,d=e.d,ok=avg>=d*0.6&&avg<=d*1.5+0.3;
  P.durN++;
  let s='tenue '+fmt(avg)+' temps (attendu '+fmt(d)+')';
  if(ok){P.durOk++;}
  else if(avg<d*0.6){P.durShort++;s+=', trop courte';}
  else{P.durLong++;s+=', trop longue';}
  P.info=(e.info?e.info+' · ':e.n.map(pcn).join(' + ')+' · ')+s;
  if(!ok)say(avg<d*0.6?'Garde la touche plus longtemps.':'Relâche plus tôt.','');
  updateHud();
}
function holdDone(a,at){
  const e=a.e;e.durs.push((at-a.at)/1000*P.bps);
  if(e.durs.length>=e.pressN&&e.pressN>0&&!e.durDone){e.durDone=true;evalDur(e);}
}
function handlePlay(m,vel,at,src){
  if(!P||!P.running||P.paused||P.t<-0.4||P.mode==='demo')return;
  if(P.chordWait){if(at-P.chordWait.at>1500)P.chordWait=null;else return;}
  const tt=tAt(at);
  P.lastVel=vel;updateHud();
  const lr=P.lastRes;
  if(lr&&at-lr.at<250&&lr.e.n.some(t=>matches(m,t))&&!P.act[m]){P.act[m]={e:lr.e,at};lr.e.vels.push(vel);return;} /* autres notes d'un accord, jouées quelques millisecondes plus tard */
  let cands;
  if(P.mode==='wait'){const e=nextEv();cands=e&&e.b-P.t<=1.5?[e]:[];}
  else cands=P.events.filter(e=>!e.state&&Math.abs(tt-e.b)<=0.4);
  if(!cands.length)return;
  const e=cands.find(x=>x.n.some(t=>matches(m,t)&&!x.got.includes(t)));
  if(src==='mic'&&mic&&mic.an2){ /* accord : le micro écoute toutes les notes avant de valider */
    const ce=e?(e.n.length>1?e:null):cands.find(x=>x.n.length>1);
    if(ce){P.chordWait={e:ce,m,vel,at};say('J\'écoute l\'accord…','good');return;}
  }
  if(!e){
    if(cands.some(x=>x.n.some(t=>matches(m,t))))return;
    P.wrong++;flash(m,'bad');
    if(P.mode==='time')P.combo=0;
    cands[0].n.forEach(t=>{P.missBy[t]=(P.missBy[t]||0)+1;});
    say('Pas la bonne note : '+pcn(m)+'.','bad');return;
  }
  e.got.push(e.n.find(t=>matches(m,t)&&!e.got.includes(t)));
  if(e.n.length>1&&src!=='midi')e.got=e.n.slice();
  P.act[m]={e,at};e.pressN++;
  e.vels.push(vel);
  if(e.got.length===e.n.length){P.lastRes={e,at};resolve(e,tt);}else{flash(m,'good');say('Il manque une note de l\'accord.','good');}
}

/* Niveaux de vitesse */
const SPD=[[40,'Très lent','🐢'],[60,'Lent','🚶'],[80,'Moyen','🙂'],[100,'Normal','🎵'],[120,'Rapide','🏃'],[150,'Très rapide','🚀']];
const spdLv=v=>{let r=null;for(const l of SPD)if(l[0]===v)r=l;return r;};
const spdLabel=v=>{const l=spdLv(v);return l?l[2]+' '+l[1]+' · '+v+' %':'Vitesse '+v+' %';};
const spdNext=(v,d)=>{if(d>0){for(const l of SPD)if(l[0]>v)return l[0];return null;}let r=null;for(const l of SPD)if(l[0]<v)r=l[0];return r;};
function syncSpd(){
  const tp=$('tempo');if(!tp)return;const v=+tp.value;
  document.querySelectorAll('.spdChip').forEach(c=>c.setAttribute('aria-pressed',String(+c.dataset.sp===v)));
  const sm=$('spdSum');if(sm){const m=radioVal('mode')||'wait';sm.textContent='⚙️ Réglage fin · '+v+' % · '+(m==='time'?'En rythme':'J\'attends mes notes');}
}
function advice(acc,mode,tempo,missBy,x){
  const worst=Object.keys(missBy).sort((a,b)=>missBy[b]-missBy[a]).slice(0,2).map(m=>nm(+m));
  let t='';
  if(acc>=0.92){
    if(mode==='wait')t='Très propre. Passe en mode « En rythme » pour travailler le tempo.';
    else if(spdNext(tempo,1))t='Excellent. Passe au niveau supérieur : '+spdLabel(spdNext(tempo,1))+'.';
    else t='Morceau maîtrisé à pleine vitesse. Passe au suivant.';
  }else if(acc>=0.7)t='Bonne base. Refais-le à la même vitesse pour le rendre fluide.';
  else {const lo=spdNext(tempo,-1);t=mode==='time'?'Ralentis'+(lo?' ('+spdLabel(lo)+')':'')+' ou passe en mode « J\'attends mes notes ».':'Ralentis'+(lo?' ('+spdLabel(lo)+')':'')+' et rejoue, une phrase à la fois.';}
  if(worst.length&&acc<0.97)t+=' Tu hésites surtout sur '+worst.join(' et ')+'.';
  if(x.durN>=4&&x.durOk/x.durN<0.6)t+=x.durShort>=x.durLong?' Tu relâches souvent trop tôt : garde la touche enfoncée jusqu\'à la fin de la valeur de la note, en comptant à voix haute.':' Tu gardes les touches trop longtemps : relâche dès que la durée est écoulée.';
  if(x.nuN>=3&&x.nuOk/x.nuN<0.6)t+=' Les nuances sont à travailler : p = doux, f = fort.';
  else if(x.nuN===0&&x.sd>22)t+=' Ton toucher est irrégulier : essaie de garder la même force sur les notes d\'une même phrase.';
  return t;
}
function endPlay(){
  stopLoop();const p=P.piece,n=P.events.length;
  const acc=P.mode==='wait'?P.hits/Math.max(1,P.hits+P.wrong):P.hits/n;
  const stars=acc>=0.95?3:acc>=0.8?2:acc>=0.5?1:0;
  const old=prog[p.id]||{stars:0,acc:0,plays:0};
  prog[p.id]={stars:Math.max(old.stars,stars),acc:Math.max(old.acc,acc),plays:old.plays+1,tempo:P.tempo,mode:P.mode};
  store.set('prog',prog);
  const d=dayRec();d.min+=P.sec/60;if(stars>0&&!d.done.includes(p.id))d.done.push(p.id);store.set('days',days);
  const avgV=P.velN?P.velSum/P.velN:null;
  let sd=0;if(P.velN>1){const mu=avgV;sd=Math.sqrt(P.velAll.reduce((a,v)=>a+(v-mu)*(v-mu),0)/P.velN);}
  const x={durN:P.durN,durOk:P.durOk,durShort:P.durShort,durLong:P.durLong,nuN:P.nuN,nuOk:P.nuOk,sd:sd};
  const missN={};Object.keys(P.missBy).forEach(k=>{missN[nm(+k)]=P.missBy[k];});
  hist.push({t:Date.now(),id:p.id,title:p.title,acc:acc,stars:stars,mode:P.mode,tempo:P.tempo,sec:Math.round(P.sec),best:P.best,touches:P.hits+P.wrong,
    dur:P.durN?P.durOk/P.durN:null,nu:P.nuN?P.nuOk/P.nuN:null,vel:avgV,sd:P.velN>1?sd:null,miss:missN});
  if(hist.length>400)hist=hist.slice(-400);store.set('hist',hist);
  const idx=allPieces().indexOf(p),nxt=idx>=0&&idx<allPieces().length-1&&!p.custom?allPieces()[idx+1]:null;
  let stats='<div class="stat"><b>'+Math.round(acc*100)+' %</b><span>réussite</span></div><div class="stat"><b>'+P.best+'</b><span>meilleure série</span></div><div class="stat"><b>'+(P.mode==='time'?P.score:P.hits+P.wrong)+'</b><span>'+(P.mode==='time'?'points':'touches jouées')+'</span></div>';
  if(P.durN>0)stats+='<div class="stat"><b>'+Math.round(P.durOk/P.durN*100)+' %</b><span>durées justes</span></div>';
  if(P.nuN>0)stats+='<div class="stat"><b>'+Math.round(P.nuOk/P.nuN*100)+' %</b><span>nuances respectées</span></div>';
  if(avgV!==null)stats+='<div class="stat"><b>'+nuName(lvl(avgV))+'</b><span>force moyenne ('+Math.round(avgV)+')</span></div>';
  $('v-result').innerHTML='<div class="card"><div class="eyebrow">'+esc(p.title)+'</div><h2>'+(stars===3?'Magnifique':stars>0?'Bien joué':'On recommence en douceur')+'</h2>'+
   '<div class="stars big" aria-label="'+stars+' étoiles sur 3">'+starsStr(stars)+'</div>'+
   '<div class="stats">'+stats+'</div>'+
   '<p>'+esc(advice(acc,P.mode,P.tempo,P.missBy,x))+'</p>'+
   (()=>{const up=acc>=0.9?spdNext(P.tempo,1):null,dn=acc<0.6?spdNext(P.tempo,-1):null;return up?'<button class="btn big" data-a="replayv" data-v="'+up+'">🚀 Rejouer plus vite · '+esc(spdLabel(up))+'</button>':dn?'<button class="btn big" data-a="replayv" data-v="'+dn+'">🐢 Rejouer plus lentement · '+esc(spdLabel(dn))+'</button>':'';})()+
   (nxt&&stars>0?'<button class="btn pri big play" data-play="'+nxt.id+'">▶ Morceau suivant</button><div class="row"><button class="btn big" style="flex:1" data-a="replay">🔁 Rejouer</button><button class="btn big" style="flex:1" data-a="home">🏠 Accueil</button></div>':'<button class="btn pri big play" data-a="replay">🔁 Rejouer</button><div class="row"><button class="btn big" style="flex:1" data-a="home">🏠 Accueil</button></div>')+'<button class="btn" data-tab="progress">📈 Voir mon évolution</button></div>';
  show('result');
}
function endDemo(){
  stopLoop();P=null;renderSetup(setupPiece);show('setup');
  setTimeout(()=>{const r=document.querySelector('#v-setup .recCard');if(r&&r.scrollIntoView){try{r.scrollIntoView({block:'start',behavior:'smooth'});}catch(e){r.scrollIntoView();}}},60);
}
function quitPlay(){
  if(P&&P.mode==='demo'){stopLoop();P=null;renderSetup(setupPiece);show('setup');return;}
  if(P){stopLoop();const d=dayRec();d.min+=P.sec/60;store.set('days',days);}
  P=null;goHome();
}
function goHome(){renderHome();show('home');}


/* ---------- Évolution ---------- */
const pctS=x=>Math.round(x*100)+' %';
const dayLabel=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
function avgOf(a,f){const v=a.map(f).filter(x=>x!==null&&x!==undefined);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;}
function trendStat(label,first,last,f,lower){
  if(last===null)return '';
  let tail='';
  if(first!==null){const diff=last-first,flat=Math.abs(diff)<(lower?3:0.02);tail=' · avant : '+f(first)+(flat?' (stable)':((lower?diff<0:diff>0)?' ▲':' ▼'));}
  return '<div class="stat"><b>'+f(last)+'</b><span>'+label+tail+'</span></div>';
}
function svgMinutes(){
  const goal=(profile&&profile.min)||10,N=14,W=336,H=130,bw=W/N,vals=[],lab=[];
  for(let i=N-1;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);vals.push((days[dt.toLocaleDateString('fr-CA')]||{}).min||0);lab.push(dt.getDate());}
  const mx=Math.max.apply(null,vals.concat([goal,1]))*1.15,y=v=>H-18-(v/mx)*(H-28);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Minutes de pratique par jour sur 14 jours">';
  s+='<line x1="0" x2="'+W+'" y1="'+y(goal)+'" y2="'+y(goal)+'" style="stroke:var(--muted)" stroke-dasharray="4 4"/>';
  vals.forEach((v,i)=>{
    s+='<rect x="'+(i*bw+3)+'" y="'+y(v)+'" width="'+(bw-6)+'" height="'+Math.max(0,H-18-y(v))+'" rx="3" style="fill:'+(v>=goal?'var(--good)':'var(--accent)')+'"/>';
    s+='<text x="'+(i*bw+bw/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" style="fill:var(--muted)">'+lab[i]+'</text>';
    if(v>=0.5)s+='<text x="'+(i*bw+bw/2)+'" y="'+(y(v)-3)+'" text-anchor="middle" font-size="8" style="fill:var(--ink)">'+Math.round(v)+'</text>';
  });

const testOn={};
function startCalib(){
  if(!micOn){setCalMsg('Active d\'abord le micro.');return;}

}
function calibNote(vel){
  calib.v.push(vel);
  if(calib.v.length<4){setCalMsg((calib.phase==='soft'?'Doucement : ':'Fort : ')+calib.v.length+' / 4');return;}
  if(calib.phase==='soft'){calib.soft=med(calib.v);calib.phase='loud';calib.v=[];setCalMsg('Maintenant 4 notes fortes.');return;}
  const lo=calib.soft,hi=med(calib.v);
  if(hi-lo>=10){const rs=Math.pow(10,((lo/127*45-55))/20);cal.mic={lo,hi,thr:Math.max(0.0012,Math.min(0.004,0.4*rs))};store.set('cal',cal);setCalMsg('Calibrage enregistré : doux ≈ '+Math.round(lo)+', fort ≈ '+Math.round(hi)+'. Le micro entendra aussi tes notes les plus douces.');}
  else setCalMsg('L\'écart est trop faible. Recommence en jouant plus doucement puis plus fort.');
  calib=null;
}
function press(m,vel,at,src){

}
function release(m,at){
  at=at||performance.now();paint(m,false);
  const t0=testOn[m];
  if(t0!==undefined){delete testOn[m];const s=(at-t0)/1000;lastTxt=lastTxt.replace(' · en cours…','')+' · tenue '+s.toFixed(1).replace('.',',')+' s ('+fmt(s*70/60)+' temps à 70 bpm)';setLast();}
  if(P&&P.running&&P.act[m]){const a=P.act[m];delete P.act[m];holdDone(a,at);}

/* Piano relié par câble MIDI (prise ronde 5 broches + câble USB, ou USB) : notes, force et durées exactes */
const midiVel=v=>{const c=cal.mic;return c.lo+(Math.max(1,v)-35)/65*(c.hi-c.lo);};
function onMidi(ev){
  try{
    const d=ev.data;if(!d||d.length<2)return;
    const cmd=d[0]&0xf0,note=d[1],v=d.length>2?d[2]:0;
    let at=ev.timeStamp>0?ev.timeStamp:performance.now();if(Math.abs(at-performance.now())>5000)at=performance.now();
    if(note<21||note>108)return;
    if(cmd===0x90&&v>0)press(note,midiVel(v),at,'midi');
    else if(cmd===0x80||(cmd===0x90&&v===0))release(note,at);
  }catch(err){recover(err);}
}
function refreshMidi(){
  if(!midiAccess)return;const names=[];
  try{midiAccess.inputs.forEach(inp=>{if(inp.state==='disconnected')return;inp.onmidimessage=onMidi;names.push(inp.name||'Entrée MIDI');});}catch(e){}
  midiList=names;
  if(names.length){
    if(micOn)stopMic();
    midiStatus('Piano relié : '+names.join(', ')+'. Joue une touche pour essayer.');
  }else midiStatus('Aucun piano détecté. Allume-le, vérifie que la fiche IN du câble est dans la prise MIDI OUT du piano, puis touche « Chercher mon piano ».',true);
}

/* ---------- Accords au micro : on écoute toutes les notes, pas seulement la première ---------- */
const CW=3072,CW_HIT=0.2,CW_EXT=0.25,CW_EXT_A1=0.15,CW_BASS_A1=0.04,CW_OWNB=0.1,CW_HARM={19:0.8,31:0.8,28:0.45,34:0.45,38:0.5,40:0.5,42:0.45,43:0.5},CW_OWN=0.1,CW_RHO={12:0.6,19:0.6,24:0.5,28:0.45,31:0.35,34:0.5,36:0.35},CW_RHOB={12:0.5,19:0.8,24:0.95,28:0.9,31:0.8,34:0.95,36:0.75},EXF=[0.75,1,1.3];
/* Extrait récent du micro, ramené à ~12 kHz (CW échantillons) ; back = échantillons bruts ignorés à la fin */
function grabWin(back){
  const m=mic;if(!m||!m.an2||!m.an2.getFloatTimeDomainData)return null;
  const f=m.f,raw=CW*f,n=m.buf2.length;if(raw+back>n)return null;
  m.an2.getFloatTimeDomainData(m.buf2);
  const o=new Float32Array(CW),from=n-back-raw;
  for(let i=0;i<CW;i++){let a=0;for(let k=0;k<f;k++)a+=m.buf2[from+i*f+k];o[i]=a/f;}
  return o;
}
/* Pour chaque demi-ton (La0 à Do8) : fondamentale seule (a1), sommet net à cette fréquence (pk, sinon c'est l'épaule d'une touche voisine), énergie avec harmoniques (sal).
   Les touches très graves (< Do2) sont presque toujours entendues par leurs harmoniques seulement (micro de téléphone, petit haut-parleur) : on y compte aussi les harmoniques 4 et 5. */
const FS_LO=21,FS_HI=108;
function fineSpec(x,sr){
  const W=x.length,b=new Float32Array(W);
  for(let i=0;i<W;i++)b[i]=x[i]*(0.5-0.5*Math.cos(2*Math.PI*i/(W-1)));
  const mag=f=>{const c=2*Math.cos(2*Math.PI*f/sr);let a=0,d=0;for(let i=0;i<W;i++){const t=b[i]+c*a-d;d=a;a=t;}return Math.sqrt(Math.max(0,a*a+d*d-c*a*d));};
  const a1=new Float32Array(110),pk=new Uint8Array(110),sal=new Float32Array(110),q=Math.pow(2,1/24);let best=0;
  for(let m=FS_LO;m<=FS_HI;m++){
    const f0=440*Math.pow(2,(m-69)/12),p0=mag(f0);a1[m]=p0;
    pk[m]=(p0>mag(f0/q)&&p0>mag(f0*q))?1:0;
    let v=p0;if(f0*2<sr/2)v+=0.6*mag(2*f0);if(f0*3<sr/2)v+=0.3*mag(3*f0);
    if(m<36){if(f0*4<sr/2)v+=0.3*mag(4*f0);if(f0*5<sr/2)v+=0.2*mag(5*f0);}
    sal[m]=v;if(m>=36&&m<=96&&v>best)best=v; /* best : référence de niveau Do2–Do7 (les extrêmes n'y comptent pas) */
  }
  return {a1,pk,sal,best};
}
/* exp : notes attendues ; A : après l'attaque ; B : juste avant (ce qui sonnait déjà) */
function judgeChord(exp,A,B,rise){
  const EX=EXF[exl]||1;
  let ref=Math.max(1e-9,A.best);for(const e of exp)if(e>=FS_LO&&e<=FS_HI&&A.sal[e]>ref)ref=A.sal[e];
  const expAll=new Set(exp.map(m=>m%12)),a=new Float32Array(12);
  for(let m=FS_LO;m<=FS_HI;m++)if(A.sal[m]>a[m%12])a[m%12]=A.sal[m];
  const chk=[...new Set(exp.filter(m=>m>=FS_LO&&m<=FS_HI).map(m=>m%12))];
  /* Une touche attendue est-elle vraiment enfoncée ? Chaque touche doit sonner PAR ELLE-MÊME : une octave, une quinte ou une douzième au-dessus d'une autre touche
     sonne déjà dans le son de celle-ci (harmonique) ; on exige donc qu'elle soit nettement plus forte que ce que la touche grave produit seule.
     Pour les basses (< Do3), dont la fondamentale est faible au micro, on compare avec l'énergie totale (harmoniques comprises) de la touche grave. */
  const hiE=exp.filter(e=>e>=48&&e<=FS_HI),mx=Math.max(1e-9,...hiE.map(e=>A.a1[e])),missing=[];
  for(const e of exp){
    if(e<FS_LO||e>FS_HI)continue;
    let ok;
    const lows=exp.filter(q=>q<e&&q>=FS_LO);
    if(e<48){
      ok=a[e%12]>=CW_HIT*ref;
      if(ok&&exp.length>=2&&e>=36)ok=A.a1[e]>=CW_BASS_A1*ref; /* graves : la note elle-même doit sonner, pas seulement les harmoniques d'autres touches */
      if(ok&&lows.length){let hm=0;for(const q of lows){const r=CW_RHOB[e-q];if(r)hm=Math.max(hm,Math.min(1.15,r*EX)*A.sal[q]);}ok=A.sal[e]>=hm;}
    }else{
      let hm=0;
      for(const q of lows){
        if(q>=48){const r=CW_RHO[e-q];if(r)hm=Math.max(hm,r*EX*A.a1[q]);}
        else{const r=CW_RHOB[e-q];if(r)hm=Math.max(hm,Math.min(1.15,r*EX)*A.sal[q]);}
      }
      ok=A.a1[e]>=CW_OWN*mx&&A.a1[e]>=hm&&A.a1[e]>=CW_OWNB*EX*ref;
    }
    if(ok&&rise&&B&&!(A.sal[e]>=1.08*B.sal[e]))ok=false; /* note seule : ce qui sonnait déjà avant l'attaque ne compte pas */
    if(!ok&&missing.indexOf(e%12)<0)missing.push(e%12);
  }
  const cands=[];
  for(let m=36;m<=96;m++)if(A.pk[m]&&A.sal[m]/ref>=CW_EXT&&A.a1[m]>=CW_EXT_A1*ref&&!expAll.has(m%12))cands.push(m);

    const lows=exp.filter(e=>e<m&&e>=FS_LO).concat(extraM.filter(e=>e<m));
    for(const q of lows){const lim=CW_HARM[m-q];if(lim&&A.a1[m]<lim*(q<36?2.5:1)*A.sal[q]){harm=true;break;}} /* touches très graves : leurs harmoniques dépassent souvent la fondamentale */
    if(harm)continue;

    extraM.push(m);
  }

  if(!post){if(!cw.single){cw.e.tries=(cw.e.tries||0)+1;P.stuck=cw.e;say('Je n\'ai pas bien entendu l\'accord : rejoue-le, toutes les touches ensemble.','');}return;}

  if(cw.single){finishSingle(cw,A,B);return;}

/* Seuil de déclenchement : bruit de la pièce × MIC_MULT, jamais en dessous d'un minimum (abaissé par le calibrage si le toucher est léger).

/* Anti-bruit : une attaque n'est acceptée que si son spectre ne change pas pendant ~0,2 s (piano). Voix, pas, claquements : spectre qui bouge ou son qui s'éteint tout de suite. [stabilité min, nouveauté max, décroissance min] */

  if(calib)return Math.max(0.0012,floor*2.4);

function micTick(){

  else{const u=mic.u8||(mic.u8=new Uint8Array(b.length));mic.an.getByteTimeDomainData(u);for(let i=0;i<b.length;i++)b[i]=(u[i]-128)/128;}

async function decodeFile(file){

  for(let j=1;j<=m;j++){W[0][j]=j*G;T[0][j]=2;}

async function analyzeFile(file,p){
  recMsg('Lecture de l\'enregistrement…');
  let buf;
  try{buf=await decodeFile(file);}
  catch(e){recMsg('Impossible de lire cet enregistrement. Utilise l\'enregistreur vocal du téléphone (formats m4a, mp3, wav ou ogg).',true);return;}
  if(buf.duration>240){recMsg('Enregistrement trop long : 4 minutes au maximum.',true);return;}
  recMsg('Analyse en cours…');await sleepT();
  const m=toMono(buf),det=segment(m.x,m.sr);
  if(det.length<2){recMsg('Presque aucune note n\'a été entendue. Rapproche le téléphone du piano, joue une note à la fois, puis recommence.',true);return;}
  recMsg('');
  const lv=levelCheck(m.x,m.sr),res=scoreTake(p,det);
  if(lv.status==='sature')res.issues.unshift('Le son saturait (trop fort) : baisse le volume du piano pour que les notes soient mieux reconnues.');
  else if(lv.status==='faible')res.issues.unshift('Le son était très faible : monte le volume du piano ou rapproche le téléphone.');
  finishRec(p,res,buf.duration);
}
async function cableTest(file){
  recMsg('Lecture de l\'essai…');
  let buf;
  try{buf=await decodeFile(file);}catch(e){recMsg('Impossible de lire cet enregistrement. Réessaie avec l\'enregistreur vocal du téléphone.',true);return;}
  if(buf.duration>120){recMsg('Essai trop long : 2 minutes au maximum.',true);return;}
  recMsg('Analyse de l\'essai…');await sleepT();
  const m=toMono(buf),lv=levelCheck(m.x,m.sr),det=segment(m.x,m.sr);
  const names=det.slice(0,8).map(d=>pcn(d.midi));
  const db=v=>Math.round(20*Math.log10(Math.max(1e-5,v)));
  if(lv.status==='sature'){recMsg('Le son sature : le piano envoie trop fort. Baisse son volume (ou utilise la sortie « line » plutôt que la sortie casque), puis refais l\'essai.',true);return;}
  if(lv.status==='faible'){recMsg('Le signal est très faible (crête '+db(lv.peak)+' dB). Monte le volume du piano. Si l\'essai reste presque silencieux, ce câble n\'est peut-être pas une entrée audio : beaucoup servent seulement à écouter. Teste aussi avec la prise « line out » du piano.',true);return;}
  let t='Niveau correct ✓ (crête '+db(lv.peak)+' dB). ';
  t+=lv.snr>=45?'Fond très silencieux : bon signe, le câble semble bien servir d\'entrée. ':lv.snr<22?'Le fond est assez présent : le téléphone capte peut-être la pièce plutôt que le câble (ou ton essai n\'a aucun moment de silence). ':'';
  t+=det.length?det.length+' note'+(det.length>1?'s':'')+' reconnue'+(det.length>1?'s':'')+(names.length?' : '+names.join(', ')+(det.length>8?'…':''):'')+'.':'Aucune note reconnue : joue des notes bien séparées, une à la fois.';
  recMsg(t,!det.length);
}

  else if(a==='midi')connectMidi(false);
  else if(a==='calib')startCalib();
  else if(a==='sheet'){openSheet(setupPiece);}
  else if(a==='sheetclose'){closeSheet();}
  else if(a==='sheetzoom'){const bx=$('sovS');sheetMode=bx&&bx.classList.contains('big')?'fit':'big';fitSheet();}
  else if(a==='sheetdemo'){closeSheet();ensureAudio();startPlay(setupPiece,+$('tempo').value,'demo');}
  else if(a==='demo'){ensureAudio();startPlay(setupPiece,+$('tempo').value,'demo');}
  else if(a==='again'){renderSetup(setupPiece);show('setup');}
  else if(a==='progress'){renderProgress();show('progress');}
  else if(a==='create'){renderCreate();show('create');}
  else if(a==='profile'){renderProfile();show('profile');}
  else if(a==='saveprofile'){
    const x=EXP[radioVal('exp')||'zero'];
    profile={name:$('pfName').value.trim(),exp:radioVal('exp')||'zero',goal:radioVal('goal')||'play',univ:radioVal('univ')||'all',min:+(radioVal('min')||10),start:x.start,tempo:x.tempo,mode:x.mode};
    store.set('profile',profile);goHome();
  }
  else if(a==='start'){const t=+$('tempo').value,m=radioVal('mode')||'wait';beginPlay(setupPiece,t,m);}
  else if(a==='replay'){const pr=prog[setupPiece.id]||{};beginPlay(setupPiece,pr.tempo||80,pr.mode||'wait');}
  else if((a==='spdm'||a==='spdp')&&P){const nv=spdNext(P.tempo,a==='spdp'?1:-1);if(nv){P.tempo=nv;const el=$('pspd');if(el)el.textContent=spdLabel(nv);}}
  else if(a==='replayv'){const pr=prog[setupPiece.id]||{};beginPlay(setupPiece,+b.dataset.v,pr.mode||'wait');}
  else if(a==='pause'&&P){P.paused=!P.paused;P.last=performance.now();b.textContent=P.paused?'Reprendre':'Pause';}
  else if(a==='skipch')skipChord();
  else if(a==='quit')quitPlay();
  else if(a==='csave'){
    const title=$('cTitle').value.trim()||'Ma mélodie',bpm=Math.max(40,Math.min(160,+$('cBpm').value||80)),dsl=$('cNotes').value;
    const r=parse(dsl);
    if(r.err){$('cMsg').textContent=r.err;$('cMsg').className='pmsg bad';return;}
    const p={id:'c'+Date.now(),custom:true,lvl:2,cat:'chant',title,bpm,dsl,desc:'Morceau créé par toi'};
    custom.push(p);store.set('custom',custom);renderSetup(p);show('setup');
  }
}
let toastT=0;
function toast(t,ms){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},ms||6000);}
function recover(err){
  try{stopLoop();}catch(x){}
  try{P=null;closeSheet(true);}catch(x){}
  toast('Un souci est survenu ('+(err&&err.message?err.message:'inconnu')+'). Je te ramène à l\'accueil : réessaie.',9000);
  try{renderHome();show('home');}catch(x){}
}
document.addEventListener('click',e=>{try{onAction(e);}catch(err){recover(err);}});
window.addEventListener('error',e=>{if(e&&e.message&&!/ResizeObserver/.test(e.message))toast('Petit souci : '+e.message,7000);});
document.addEventListener('change',e=>{try{if(e.target&&e.target.name==='mode')syncSpd();if(e.target&&e.target.id==='fUni'){fUni=e.target.value;renderHome();}}catch(err){recover(err);}});
document.addEventListener('input',e=>{
  const t=e.target;if(!t)return;
  if(t.id==='fQ'){fQ=t.value;renderLib();}
  else if(t.id==='tempo'){const v=$('tempoV');if(v)v.textContent=t.value;syncSpd();}
  else if(t.classList&&t.classList.contains('mNr')){nr=+t.value;store.set('nr',nr);document.querySelectorAll('.mNr').forEach(x=>{x.value=nr;});}
  else if(t.classList&&t.classList.contains('mEx')){exl=+t.value;store.set('exl',exl);document.querySelectorAll('.mEx').forEach(x=>{x.value=exl;});}
  else if(t.classList&&t.classList.contains('mSens')){sens=+t.value;store.set('sens',sens);document.querySelectorAll('.mSens').forEach(x=>{x.value=sens;});}
});
$('tgMic').addEventListener('click',()=>{if(nMidi()>0){toast('Piano relié en MIDI : rien à activer, joue simplement.',3500);return;}if(micOn)stopMic();else startMic();});
try{if(store.get('midi',0)&&navigator.requestMIDIAccess)connectMidi(true);}catch(e){}
/* Écran verrouillé ou application quittée : on met la partie en pause, et on remet l'écran en veille désactivée au retour */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(P&&P.running&&!P.paused){P.paused=true;const b=document.getElementById('bPause');if(b)b.textContent='Reprendre';}
  }else{
    if(ctx&&ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
    keepAwake();
  }
});

setTop();
if(profile){renderHome();show('home');}else{renderProfile();show('profile');}
})();
</script>

</html>
